<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Builder - AI Blend</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="workflow-builder.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="workflow-builder">
        <!-- Sidebar -->
        <aside class="builder-sidebar">
            <div class="sidebar-header">
                <h1>AI Blend</h1>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard.html">
                    <i class="fas fa-home"></i>
                    Dashboard
                </a>
                <a href="/workflow-builder.html" class="active">
                    <i class="fas fa-project-diagram"></i>
                    Workflows
                </a>
                <a href="/credentials.html">
                    <i class="fas fa-key"></i>
                    Credentials
                </a>
                <a href="/executions.html">
                    <i class="fas fa-play-circle"></i>
                    Executions
                </a>
                <a href="/templates.html">
                    <i class="fas fa-file-alt"></i>
                    Templates
                </a>
                <a href="/community.html">
                    <i class="fas fa-users"></i>
                    Community
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="builder-content">
            <!-- Top Bar -->
            <header class="builder-header">
                <div class="header-left">
                    <h2>Workflow Builder</h2>
                </div>
                <div class="header-right">
                    <button class="save-btn">
                        <i class="fas fa-save"></i>
                        Save Workflow
                    </button>
                    <button class="run-btn">
                        <i class="fas fa-play"></i>
                        Run Workflow
                    </button>
                </div>
            </header>

            <!-- Workflow Canvas -->
            <div class="workflow-canvas">
                <!-- Node Palette -->
                <div class="node-palette">
                    <h3>AI Services</h3>
                    <div class="node-category">
                        <h4>Language Models</h4>
                        <div class="node-item" draggable="true" data-type="gpt">
                            <i class="fas fa-robot"></i>
                            GPT-4
                        </div>
                        <div class="node-item" draggable="true" data-type="claude">
                            <i class="fas fa-robot"></i>
                            Claude
                        </div>
                    </div>
                    <div class="node-category">
                        <h4>Image Generation</h4>
                        <div class="node-item" draggable="true" data-type="stable-diffusion">
                            <i class="fas fa-image"></i>
                            Stable Diffusion
                        </div>
                        <div class="node-item" draggable="true" data-type="dalle">
                            <i class="fas fa-image"></i>
                            DALL-E
                        </div>
                    </div>
                    <div class="node-category">
                        <h4>Utilities</h4>
                        <div class="node-item" draggable="true" data-type="input">
                            <i class="fas fa-keyboard"></i>
                            Input
                        </div>
                        <div class="node-item" draggable="true" data-type="output">
                            <i class="fas fa-file-export"></i>
                            Output
                        </div>
                        <div class="node-item" draggable="true" data-type="condition">
                            <i class="fas fa-code-branch"></i>
                            Condition
                        </div>
                    </div>
                </div>

                <!-- Canvas Area -->
                <div class="canvas-area">
                    <div class="canvas-grid"></div>
                    <div class="nodes-container"></div>
                </div>

                <!-- Properties Panel -->
                <div class="properties-panel">
                    <h3>Properties</h3>
                    <div class="properties-content">
                        <div class="property-group">
                            <h4>Workflow Settings</h4>
                            <div class="property-item">
                                <label>Name</label>
                                <input type="text" class="workflow-name" placeholder="Enter workflow name">
                            </div>
                            <div class="property-item">
                                <label>Description</label>
                                <textarea class="workflow-description" placeholder="Enter workflow description"></textarea>
                            </div>
                        </div>
                        <div class="property-group">
                            <h4>Selected Node</h4>
                            <div class="node-properties">
                                <p class="no-selection">Select a node to edit its properties</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="workflow-builder.js"></script>
</body>
</html>
